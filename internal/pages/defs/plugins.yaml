# Configuration of simple plug-ins: one entry each. Shown on the Plugins page
# (not in the settings menu). Plug-in attributes are mostly absent until set,
# hence sparse: the integration test checks them against the schema instead.
pages:
  - id: plugin-referint
    section: plugins
    plugin: referential integrity postoperation
    dn: cn=referential integrity postoperation,cn=plugins,cn=config
    sparse: true
    fields:
      - {attr: referint-membership-attr, type: list}
      - {attr: referint-update-delay, type: duration, min: -1}
      - {attr: referint-logfile, type: string}
      - {attr: nsslapd-pluginEntryScope, type: list, group: scope}
      - {attr: nsslapd-pluginExcludeEntryScope, type: list, group: scope}
      - {attr: nsslapd-pluginContainerScope, type: list, group: scope}

  - id: plugin-memberof
    section: plugins
    plugin: MemberOf Plugin
    dn: cn=MemberOf Plugin,cn=plugins,cn=config
    sparse: true
    fields:
      - {attr: memberOfGroupAttr, type: list}
      - {attr: memberOfAttr, type: string}
      - {attr: memberOfAllBackends, type: bool}
      - {attr: memberOfSkipNested, type: bool}
      - {attr: memberOfAutoAddOC, type: string}
      - {attr: memberOfEntryScope, type: list, group: scope}
      - {attr: memberOfEntryScopeExcludeSubtree, type: list, group: scope}

  # Every Attribute Uniqueness instance (the shipped one and those added
  # through ds-ui) is configured with this page, bound by ?dn=.
  - id: plugin-uniqueness
    section: plugins
    entryClass: nsSlapdPlugin
    entryFilter: (nsslapd-pluginPath=libattr-unique-plugin)
    pluginPath: libattr-unique-plugin
    sparse: true
    fields:
      - {attr: uniqueness-attribute-name, type: list}
      - {attr: uniqueness-subtrees, type: list, group: scope}
      - {attr: uniqueness-exclude-subtrees, type: list, group: scope}
      - {attr: uniqueness-across-all-subtrees, type: bool, group: scope}
      - {attr: uniqueness-top-entry-oc, type: string, group: scope}
      - {attr: uniqueness-subtree-entries-oc, type: string, group: scope}

  # USN itself has no settings; the global counter lives in cn=config.
  - id: plugin-usn
    section: plugins
    plugin: USN
    dn: cn=config
    fields:
      - {attr: nsslapd-entryusn-global, type: bool}
      - {attr: nsslapd-entryusn-import-initval, type: string}

  - id: plugin-rootdn
    section: plugins
    plugin: RootDN Access Control
    dn: cn=RootDN Access Control,cn=plugins,cn=config
    sparse: true
    fields:
      # Directory Manager is what ds-ui binds as: a wrong rule locks it out.
      - {attr: rootdn-open-time, type: string, group: time, danger: true}
      - {attr: rootdn-close-time, type: string, group: time, danger: true}
      - {attr: rootdn-days-allowed, type: string, group: time, danger: true}
      - {attr: rootdn-allow-ip, type: list, group: hosts, danger: true}
      - {attr: rootdn-deny-ip, type: list, group: hosts, danger: true}
      - {attr: rootdn-allow-host, type: list, group: hosts, danger: true}
      - {attr: rootdn-deny-host, type: list, group: hosts, danger: true}

  - id: plugin-retrocl
    section: plugins
    plugin: Retro Changelog Plugin
    dn: cn=Retro Changelog Plugin,cn=plugins,cn=config
    sparse: true
    fields:
      - {attr: nsslapd-changelogmaxage, type: string, restart: true}
      - {attr: nsslapd-changelogtrim-interval, type: duration, min: 1, restart: true}
      - {attr: nsslapd-include-suffix, type: list, restart: true}
      - {attr: nsslapd-exclude-suffix, type: list, restart: true}
      - {attr: nsslapd-attribute, type: list, restart: true}

  - id: plugin-account-policy
    section: plugins
    plugin: Account Policy Plugin
    dn: cn=config,cn=Account Policy Plugin,cn=plugins,cn=config
    sparse: true
    fields:
      - {attr: alwaysRecordLogin, type: bool, bool: ["yes", "no"]}
      - {attr: alwaysRecordLoginAttr, type: string}
      - {attr: stateAttrName, type: string}
      - {attr: altStateAttrName, type: string}
      - {attr: specAttrName, type: string}
      - {attr: limitAttrName, type: string}
      - {attr: checkAllStateAttrs, type: bool, bool: ["yes", "no"]}

  - id: plugin-pam
    section: plugins
    plugin: PAM Pass Through Auth
    dn: cn=PAM Pass Through Auth,cn=plugins,cn=config
    sparse: true
    fields:
      - {attr: pamService, type: string}
      - {attr: pamIDMapMethod, type: string}
      - {attr: pamIDAttr, type: string}
      - {attr: pamFallback, type: bool, bool: ["TRUE", "FALSE"]}
      - {attr: pamSecure, type: bool, bool: ["TRUE", "FALSE"]}
      - {attr: pamFilter, type: string, group: scope}
      - {attr: pamIncludeSuffix, type: list, group: scope}
      - {attr: pamExcludeSuffix, type: list, group: scope}
      - {attr: pamMissingSuffix, type: enum, values: [ERROR, ALLOW, IGNORE], group: scope}

# Plug-ins configured with several entries (definitions): one collection
# each. Texts: pages.<collection id>.title/.fields.<attr>.
collections:
  - id: linked-attributes
    plugin: Linked Attributes
    parent: cn=Linked Attributes,cn=plugins,cn=config
    objectClasses: [top, extensibleObject]
    fields:
      - {attr: linkType, type: string, required: true}
      - {attr: managedType, type: string, required: true}
      - {attr: linkScope, type: dn}

  - id: dna-ranges
    plugin: Distributed Numeric Assignment Plugin
    parent: cn=Distributed Numeric Assignment Plugin,cn=plugins,cn=config
    objectClasses: [top, extensibleObject]
    fields:
      - {attr: dnaType, type: list, required: true}
      - {attr: dnaScope, type: dn, required: true}
      - {attr: dnaFilter, type: string, required: true}
      - {attr: dnaNextValue, type: int, min: 0, required: true}
      - {attr: dnaMaxValue, type: int, min: -1}
      - {attr: dnaInterval, type: int, min: 1}
      - {attr: dnaMagicRegen, type: string}
      - {attr: dnaPrefix, type: string}
      - {attr: dnaExcludeScope, type: list}
      - {attr: dnaThreshold, type: int, min: 1, group: replication}
      - {attr: dnaSharedCfgDN, type: dn, group: replication}
      - {attr: dnaNextRange, type: string, group: replication}

  - id: automember-definitions
    plugin: Auto Membership Plugin
    parent: cn=Auto Membership Plugin,cn=plugins,cn=config
    objectClasses: [top, autoMemberDefinition]
    fields:
      - {attr: autoMemberScope, type: dn, required: true}
      - {attr: autoMemberFilter, type: string, required: true}
      - {attr: autoMemberGroupingAttr, type: string, required: true}
      - {attr: autoMemberDefaultGroup, type: list}

  - id: automember-rules
    plugin: Auto Membership Plugin
    under: automember-definitions
    objectClasses: [top, autoMemberRegexRule]
    fields:
      - {attr: autoMemberTargetGroup, type: dn, required: true}
      - {attr: autoMemberInclusiveRegex, type: list}
      - {attr: autoMemberExclusiveRegex, type: list}
      - {attr: description, type: string}

  - id: managed-entries
    plugin: Managed Entries
    parent: cn=Managed Entries,cn=plugins,cn=config
    objectClasses: [top, extensibleObject]
    fields:
      - {attr: originScope, type: dn, required: true}
      - {attr: originFilter, type: string, required: true}
      - {attr: managedBase, type: dn, required: true}
      - {attr: managedTemplate, type: dn, required: true}
