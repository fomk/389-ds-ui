# Server-wide settings on cn=config.
# Texts: pages.<id>.title/.description, pages.<id>.fields.<attr>.label/.help
# (or pages._fields.<text> when the field sets "text"), pages._groups.<group>.
pages:
  - id: server-general
    section: server
    order: 10
    dn: cn=config
    fields:
      - {attr: nsslapd-localhost, type: string, group: network}
      - {attr: nsslapd-port, type: int, min: 0, max: 65535, group: network, restart: true, danger: true}
      - {attr: nsslapd-securePort, type: int, min: 0, max: 65535, group: network, restart: true}
      - {attr: nsslapd-listenhost, type: string, group: network, restart: true, danger: true}
      - {attr: nsslapd-readonly, type: bool, group: behaviour}
      - {attr: nsslapd-schemacheck, type: bool, group: behaviour}
      - {attr: nsslapd-syntaxcheck, type: bool, group: behaviour}
      - {attr: nsslapd-dn-validate-strict, type: bool, group: behaviour}
      - {attr: nsslapd-lastmod, type: bool, group: behaviour}
      - {attr: nsslapd-entryusn-global, type: bool, group: behaviour}
      - {attr: nsslapd-ignore-virtual-attrs, type: bool, group: behaviour}
      - {attr: nsslapd-return-exact-case, type: bool, group: behaviour, restart: true}

  - id: server-limits
    section: server
    order: 20
    dn: cn=config
    fields:
      - {attr: nsslapd-sizelimit, type: int, min: -1, group: search}
      - {attr: nsslapd-timelimit, type: duration, min: -1, group: search}
      - {attr: nsslapd-max-filter-nest-level, type: int, min: 0, group: search}
      - {attr: nsslapd-maxsimplepaged-per-conn, type: int, min: -1, group: search}
      - {attr: nsslapd-idletimeout, type: duration, min: 0, group: connections}
      - {attr: nsslapd-ioblocktimeout, type: int, min: 0, unit: ms, group: connections}
      - {attr: nsslapd-maxbersize, type: size, min: 0, group: connections}
      - {attr: nsslapd-maxsasliosize, type: size, min: -1, group: connections}
      - {attr: nsslapd-maxdescriptors, type: int, min: 1, group: connections, restart: true}
      - {attr: nsslapd-threadnumber, type: int, min: -1, group: threads}
      - {attr: nsslapd-maxthreadsperconn, type: int, min: 1, group: threads}
      - {attr: nsslapd-ndn-cache-enabled, type: bool, group: caches}
      - {attr: nsslapd-ndn-cache-max-size, type: size, min: 0, group: caches}

  - id: disk-monitoring
    section: server
    order: 30
    dn: cn=config
    fields:
      - {attr: nsslapd-disk-monitoring, type: bool}
      - {attr: nsslapd-disk-monitoring-threshold, type: size, min: 4096}
      - {attr: nsslapd-disk-monitoring-grace-period, type: int, min: 1, unit: min}
      - {attr: nsslapd-disk-monitoring-logging-critical, type: bool}
      - {attr: nsslapd-disk-monitoring-readonly-on-threshold, type: bool}
